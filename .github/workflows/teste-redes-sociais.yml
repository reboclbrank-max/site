name: Teste Redes Sociais

# Testa conectividade e postagem em Instagram, X, Nostr e Gmail
# usando os secrets já configurados no GitHub Actions.
# Disparo: manual (workflow_dispatch) e schedule diário.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'  # 09:00 UTC = 06:00 BRT

permissions:
  contents: read

concurrency:
  group: teste-redes-sociais
  cancel-in-progress: false

jobs:
  testar-redes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Instala dependências de teste
        run: npm install --no-save --no-audit --no-fund node-fetch@3

      - name: Testa Instagram, X, Nostr, Gmail (conectividade + postagem)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          X_TOKEN: ${{ secrets.X_TOKEN }}
          NOSTR_KEY: ${{ secrets.NOSTR_KEY }}
          GMAIL_CHAT_ADDRESS: ${{ secrets.GMAIL_CHAT_ADDRESS }}
          GMAIL_CHAT_PASS: ${{ secrets.GMAIL_CHAT_PASS }}
          GMAIL_CHAT_APPPASS: ${{ secrets.GMAIL_CHAT_APPPASS }}
        run: |
          node -e "
            const https = require('https');
            const http = require('http');

            function httpGet(url, token, timeoutMs = 15000) {
              return new Promise((resolve, reject) => {
                const u = new URL(url);
                const lib = u.protocol === 'https:' ? https : http;
                const headers = { 'User-Agent': 'rebocl-teste-redes/1.0' };
                if (token) headers.Authorization = 'Bearer ' + token;
                const req = lib.get(u, { timeout: timeoutMs, headers }, (res) => {
                  let dados = '';
                  res.on('data', c => dados += c);
                  res.on('end', () => resolve({ status: res.statusCode, corpo: dados }));
                });
                req.on('timeout', () => { req.destroy(); reject(new Error('timeout')); });
                req.on('error', reject);
              });
            }

            function httpPost(url, corpo, token, timeoutMs = 15000) {
              return new Promise((resolve, reject) => {
                const u = new URL(url);
                const lib = u.protocol === 'https:' ? https : http;
                const json = JSON.stringify(corpo || {});
                const headers = {
                  'User-Agent': 'rebocl-teste-redes/1.0',
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(json)
                };
                if (token) headers.Authorization = 'Bearer ' + token;
                const req = lib.request(u, { method: 'POST', timeout: timeoutMs, headers }, (res) => {
                  let dado = '';
                  res.on('data', c => dado += c);
                  res.on('end', () => resolve({ status: res.statusCode, corpo: dado }));
                });
                req.on('timeout', () => { req.destroy(); reject(new Error('timeout')); });
                req.on('error', reject);
                req.write(json);
                req.end();
              });
            }

            async function testar() {
              const redes = [
                { nome: 'instagram', endpoint: 'https://graph.instagram.com/me', token: process.env.IG_TOKEN, precisaToken: true },
                { nome: 'x', endpoint: 'https://api.twitter.com/2/users/me', token: process.env.X_TOKEN, precisaToken: true },
                { nome: 'nostr', endpoint: 'https://nostr.wine/', token: process.env.NOSTR_KEY, precisaToken: false },
                { nome: 'gmail', endpoint: 'https://gmail.googleapis.com/gmail/v1/users/me/profile', token: process.env.GMAIL_CHAT_ADDRESS, precisaToken: true }
              ];
              const resultados = [];
              for (const rede of redes) {
                try {
                  const r = await httpGet(rede.endpoint, rede.token);
                  const online = r.status >= 200 && r.status < 400;
                  let podePostar = false;
                  let postDetalhe = '';
                  if (rede.token && online) {
                    try {
                      let postUrl, postBody;
                      if (rede.nome === 'instagram') {
                        postUrl = 'https://graph.instagram.com/v21.0/' + process.env.IG_USER_ID + '/media';
                        postBody = { image_url: 'https://img.itch.zone/aW1hZ2UvNTAxNzQwNC8zMDA0MDAyNy5wbmc=/original/sNW2uy.png', caption: 'teste reboclbrank', access_token: rede.token };
                      } else if (rede.nome === 'x') {
                        postUrl = 'https://api.twitter.com/2/tweets';
                        postBody = { text: 'teste reboclbrank #Prancheta #Ceifalume' };
                      } else if (rede.nome === 'gmail') {
                        postUrl = 'https://gmail.googleapis.com/gmail/v1/users/me/messages/send';
                        postBody = { raw: '' };
                      }
                      if (postUrl) {
                        const pr = await httpPost(postUrl, postBody, rede.token);
                        podePostar = pr.status >= 200 && pr.status < 400;
                        postDetalhe = 'HTTP ' + pr.status;
                      } else {
                        podePostar = true;
                        postDetalhe = 'sem endpoint de postagem definido';
                      }
                    } catch (e) {
                      podePostar = false;
                      postDetalhe = 'erro postagem: ' + e.message.slice(0, 80);
                    }
                  }
                  resultados.push({
                    rede: rede.nome,
                    online: online,
                    status_http: r.status,
                    pode_postar: podePostar,
                    tem_token: !!rede.token,
                    detalhe: postDetalhe,
                    motivo: online
                      ? (rede.token ? (podePostar ? '✅ online + postagem OK' : '⚠️ online + token, postagem falhou') : '✅ online (sem token)')
                      : '❌ offline/inalcançável'
                  });
                } catch (e) {
                  resultados.push({
                    rede: rede.nome,
                    online: false,
                    status_http: null,
                    pode_postar: false,
                    tem_token: !!rede.token,
                    detalhe: e.message.slice(0, 120),
                    motivo: '❌ erro: ' + e.message.slice(0, 80)
                  });
                }
              }
              console.log('## Resultado Teste Redes Sociais');
              console.log(JSON.stringify(resultados, null, 2));
              const falhas = resultados.filter(r => !r.online);
              const semPostagem = resultados.filter(r => r.online && !r.pode_postar);
              if (falhas.length > 0) {
                console.log('::error::Redes offline: ' + falhas.map(r => r.rede).join(', '));
                process.exit(1);
              }
              if (semPostagem.length > 0) {
                console.log('::warning::Redes online sem postagem: ' + semPostagem.map(r => r.rede).join(', '));
              }
              console.log('✅ Teste de redes sociais concluído');
            }
            testar().catch(e => { console.error('::error::' + e.message); process.exit(1); });
          "

      - name: Resumo do teste
        run: |
          echo "## Teste Redes Sociais - Concluído" >> "$GITHUB_STEP_SUMMARY"
          echo "Redes testadas: Instagram, X, Nostr, Gmail" >> "$GITHUB_STEP_SUMMARY"
          echo "Secrets usados: IG_TOKEN, IG_USER_ID, X_TOKEN, NOSTR_KEY, GMAIL_CHAT_ADDRESS, GMAIL_CHAT_PASS, GMAIL_CHAT_APPPASS" >> "$GITHUB_STEP_SUMMARY"
