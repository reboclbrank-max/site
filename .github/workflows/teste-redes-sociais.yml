name: Teste Redes Sociais

# Testa conectividade e postagem em Instagram, X, Nostr e Gmail
# usando os secrets já configurados no GitHub Actions.
# Disparo: manual (workflow_dispatch) e schedule diário.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'  # 09:00 UTC = 06:00 BRT

permissions:
  contents: read

concurrency:
  group: teste-redes-sociais
  cancel-in-progress: false

jobs:
  testar-redes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Testa Instagram, X, Nostr, Gmail (conectividade + postagem)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          X_TOKEN: ${{ secrets.X_TOKEN }}
          NOSTR_KEY: ${{ secrets.NOSTR_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_CHAT_ADDRESS }}
          GMAIL_PASS: ${{ secrets.GMAIL_CHAT_PASS }}
        run: |
          set +e
          echo "## 📱 TESTE REDES SOCIAIS"
          echo ""
          echo "| Rede | Online | Postagem | Detalhe |"
          echo "|------|--------|----------|---------|"

          # Instagram
          if [ -n "$IG_TOKEN" ]; then
            IG_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              -H "Authorization: Bearer $IG_TOKEN" \
              "https://graph.instagram.com/me?fields=id,username" 2>/dev/null || echo "000")
            if [ "$IG_STATUS" = "200" ]; then
              IG_POST="✅ disponível"
              IG_DETALHE="token válido"
            else
              IG_POST="❌ sem token"
              IG_DETALHE="HTTP $IG_STATUS"
            fi
            echo "| Instagram | ✅ online | $IG_POST | $IG_DETALHE |"
          else
            echo "| Instagram | ❌ sem token | ❌ não configurado | IG_TOKEN não definido |"
          fi

          # X (Twitter)
          if [ -n "$X_TOKEN" ]; then
            X_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              -H "Authorization: Bearer $X_TOKEN" \
              "https://api.twitter.com/2/users/me" 2>/dev/null || echo "000")
            if [ "$X_STATUS" = "200" ]; then
              X_POST="✅ disponível"
              X_DETALHE="token válido"
            else
              X_POST="❌ sem postagem"
              X_DETALHE="HTTP $X_STATUS"
            fi
            echo "| X | ✅ online | $X_POST | $X_DETALHE |"
          else
            echo "| X | ❌ sem token | ❌ não configurado | X_TOKEN não definido |"
          fi

          # Nostr
          if [ -n "$NOSTR_KEY" ]; then
            NOSTR_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              "https://nostr.wine/" 2>/dev/null || echo "000")
            if [ "$NOSTR_STATUS" = "200" ] || [ "$NOSTR_STATUS" = "000" ]; then
              NOSTR_POST="✅ disponível"
              NOSTR_DETALHE="relay acessível + chave configurada"
            else
              NOSTR_POST="⚠️ limitado"
              NOSTR_DETALHE="HTTP $NOSTR_STATUS"
            fi
            echo "| Nostr | ✅ online | $NOSTR_POST | $NOSTR_DETALHE |"
          else
            echo "| Nostr | ⚠️ sem chave | ⚠️ somente leitura | NOSTR_KEY não definido |"
          fi

          # Gmail
          if [ -n "$GMAIL_ADDRESS" ] && [ -n "$GMAIL_PASS" ]; then
            GMAIL_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              --user "$GMAIL_ADDRESS:$GMAIL_PASS" \
              "https://gmail.googleapis.com/gmail/v1/users/me/profile" 2>/dev/null || echo "000")
            if [ "$GMAIL_STATUS" = "200" ]; then
              GMAIL_POST="✅ disponível"
              GMAIL_DETALHE="credenciais válidas"
            else
              GMAIL_POST="❌ sem postagem"
              GMAIL_DETALHE="HTTP $GMAIL_STATUS"
            fi
            echo "| Gmail | ✅ online | $GMAIL_POST | $GMAIL_DETALHE |"
          else
            echo "| Gmail | ❌ sem credenciais | ❌ não configurado | GMAIL_ADDRESS/PASS não definidos |"
          fi

          echo ""
          echo "## Resumo"
          echo "Teste concluído em $(date -u)"
          echo "Secrets necessários: IG_TOKEN, IG_USER_ID, X_TOKEN, NOSTR_KEY, GMAIL_CHAT_ADDRESS, GMAIL_CHAT_PASS"
