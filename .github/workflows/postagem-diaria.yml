name: postagem-diaria
on:
  schedule:
    - cron: '13,33,53 * * * *'   # pulso: acorda o vigia do chat (job separado, não posta)
    # GitHub documenta congestionamento no início da hora; mantém 8 ciclos/dia,
    # mas os distribui no minuto 17 para reduzir atraso/queda de execução.
    - cron: '17 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
# Pulso técnico e ciclo de marketing não podem disputar a única vaga pendente.
# O dispatch de retaguarda entra no grupo do postador; o pulso apenas o coordena.
concurrency:
  group: ${{ github.event.schedule == '13,33,53 * * * *' && 'postagem-acorda' || 'postagem-diaria' }}
  cancel-in-progress: false
jobs:
  postar:
    if: github.event.schedule != '13,33,53 * * * *'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Barreira offline de autonomia e marca
        run: |
          python3 tools/testes-autonomia-marketing.py
          python3 tools/testes-metricas.py
          python3 tools/testes-interacao.py
          python3 tools/testes-devlog.py
          python3 tools/testes-sondar-trava-youtube.py
          python3 tools/testes-kit-youtube.py
          python3 tools/testes-itch-navegador.py
          python3 tools/testes-administrar-itch.py
          node tools/montar-bookmarklet.js --verificar
          node tools/testes-bookmarklet-itch.js
          python3 tools/testes-administrar-youtube.py
          python3 tools/testes-painel-marketing.py
          python3 tools/testes-decisoes.py
          python3 tools/testes-aprender-horario.py
          python3 tools/testes-auditar-inteligencia.py
          python3 tools/testes-perceber.py
          python3 tools/testes-juizo.py
      - name: A casa posta sozinha
        run: |
          pip install -q coincurve websocket-client
          python3 tools/postador.py
          # Kit de envio do YouTube: PRODUZ, não publica. O envio depende do OAuth do dono.
          python3 tools/kit-youtube.py || echo "kit do YouTube com problema — registrado, sem publicar"
          # O painel público é gerado do MESMO log que acabou de ser escrito: autonomia sem
          # vitrine vira promessa. Ele é versionado e o site publica.
          python3 tools/decisoes.py
          python3 tools/auditar-inteligencia.py
          python3 tools/perceber.py
          python3 tools/painel-marketing.py
          git config user.name "casa-rebocl"
          git config user.email "casa@rebocl.local"
          git add marketing.html posts/log.md posts/decisoes.json posts/decisoes.md posts/auditoria-inteligencia.json posts/auditoria-inteligencia.md posts/percebido.json posts/percebido.md posts/fila-tarefas.json
          if ! git diff --cached --quiet; then
            git commit -q -m "marketing: painel e log do ciclo ($(date -u +'%d/%m %H:%M UTC'))"
            git stash push -u -q -m "sobras-do-run" >/dev/null 2>&1 || true
            enviado=0
            for tentativa in 1 2 3; do
              if git fetch -q origin main && git rebase -q origin/main && git push; then
                echo "painel no main (tentativa $tentativa)"
                enviado=1
                break
              fi
              echo "push recusado (tentativa $tentativa) — rebase e nova tentativa"
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            if [ "$enviado" != "1" ]; then
              # Não aborta o ciclo: o devlog e o log do ciclo ainda têm de entrar. O run
              # termina vermelho no fim, com o motivo medido.
              echo "::error::3 tentativas e o painel não entrou no main"
              painel_falhou=1
            fi
          fi
          # Devlog no site da casa: o itch não tem API para devlog, então o diário de bordo é
          # publicado onde não existe trava — por commit, no nosso próprio domínio.
          python3 tools/devlog.py
          git config user.name "casa-rebocl"
          git config user.email "casa@rebocl.local"
          git add posts/ blog/
          git commit -m "🤖 postagem automatica $(date -u +'%d/%m %H:%M')" || echo "nada a commitar"
          ok=0
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin main || true
            if git push; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::3 tentativas e o ciclo não entrou no main (o log ficaria só neste run)"
            exit 1
          fi
          if [ "${painel_falhou:-0}" = "1" ]; then
            echo "::error::o ciclo entrou, mas o painel marketing.html ficou velho"
            exit 1
          fi
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GHPAT: ${{ secrets.GHPAT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APPPASS: ${{ secrets.BLUESKY_APPPASS }}
          MASTODON_URL: ${{ secrets.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NOSTR_KEY: ${{ secrets.NOSTR_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}

      - name: Mede o que foi postado e o que voltou
        # Só leitura pública: não publica, não usa segredo, não consome cota de repo privado.
        # Fica fora do caminho crítico: se a medição falhar, a postagem já aconteceu.
        if: always()
        continue-on-error: true
        env:
          # Leitura de contadores e insights do Instagram. Sem estes segredos o medidor
          # registra NAO_OBSERVAVEL — nunca zero. Nada é impresso nem versionado.
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          # Uma chave por conta do itch (a casa publica em duas). Sem elas: NAO_OBSERVAVEL.
          ITCH_API_KEYS: ${{ secrets.ITCH_API_KEYS }}
          # Leitura pública do YouTube (inscritos, vídeos, shorts). Não é OAuth.
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
        run: |
          python3 tools/metricas.py || echo "medição indisponível nesta rodada"
          # O aprendizado de horário lia posts/desempenho.md e NUNCA era executado: a regra
          # existia e ninguém a cobrava. Agora roda a cada medição e grava o motivo da decisão.
          python3 tools/aprender-horario.py || echo "aprendizado de horário indisponível nesta rodada"
          # O juízo relê o feed medido: só vira "gosto" o traço com amostra e sinal claros.
          python3 tools/juizo.py || echo "juízo indisponível nesta rodada"
          git config user.name "casa-rebocl"
          git config user.email "casa@rebocl.local"
          git add posts/desempenho.md posts/placar-metas.md posts/aprendizado.json \
            posts/feed-medido.json posts/perfil-de-gosto.json posts/memoria-de-gosto.json 2>/dev/null || true
          git commit -m "📊 desempenho $(date -u +'%d/%m %H:%M')" || echo "sem mudança de medição"
          ok=0
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin main || true
            if git push; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::3 tentativas e a medição não entrou no main"
            exit 1
          fi

      - name: Acorda o vigia da casa (chat de e-mail)
        if: always()
        continue-on-error: true
        run: |
          curl -s -o /dev/null -w "vigia do chat: %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GHPAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/reboclbrank-max/chat/actions/workflows/vigia.yml/dispatches \
            -d '{"ref":"main"}' || true

  acorda:
    if: github.event.schedule == '13,33,53 * * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Lê o último ciclo público no main atual
        run: |
          git fetch -q origin main
          git show origin/main:posts/log.md > /tmp/posts-log.md
      - name: Retaguarda conservadora da cadência de marketing
        run: python3 tools/retaguarda-postagem.py /tmp/posts-log.md
        env:
          GHPAT: ${{ secrets.GHPAT }}
      - name: Acorda o vigia da casa (chat de e-mail)
        if: always()
        run: |
          curl -s -o /dev/null -w "vigia do chat: %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GHPAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/reboclbrank-max/chat/actions/workflows/vigia.yml/dispatches \
            -d '{"ref":"main"}' || true
