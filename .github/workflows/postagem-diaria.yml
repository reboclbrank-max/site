name: postagem-diaria
on:
  schedule:
    - cron: '13,33,53 * * * *'   # pulso: acorda o vigia do chat (job separado, não posta)
    - cron: '0 9 * * *'
    - cron: '0 12 * * *'
    - cron: '0 15 * * *'
    - cron: '0 18 * * *'
    - cron: '0 21 * * *'
    - cron: '0 0 * * *'
    - cron: '0 3 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: postagem-diaria
  cancel-in-progress: false
jobs:
  postar:
    if: github.event.schedule != '13,33,53 * * * *'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: A casa posta sozinha
        run: |
          pip install -q coincurve websocket-client
          python3 tools/postador.py
          git config user.name "casa-rebocl"
          git config user.email "casa@rebocl.local"
          git add posts/
          git commit -m "🤖 postagem automatica $(date -u +'%d/%m %H:%M')" || echo "nada a commitar"
          ok=0
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin main || true
            if git push; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = "1" ] || echo "push falhou apos 3 tentativas (a proxima rodada cobre)"
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GHPAT: ${{ secrets.GHPAT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APPPASS: ${{ secrets.BLUESKY_APPPASS }}
          MASTODON_URL: ${{ secrets.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NOSTR_KEY: ${{ secrets.NOSTR_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}

      - name: Acorda o vigia da casa (chat de e-mail)
        if: always()
        continue-on-error: true
        run: |
          curl -s -o /dev/null -w "vigia do chat: %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GHPAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/reboclbrank-max/chat/actions/workflows/vigia.yml/dispatches \
            -d '{"ref":"main"}' || true

  acorda:
    if: github.event.schedule == '13,33,53 * * * *'
    runs-on: ubuntu-24.04
    steps:
      - name: Acorda o vigia da casa (chat de e-mail)
        run: |
          curl -s -o /dev/null -w "vigia do chat: %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GHPAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/reboclbrank-max/chat/actions/workflows/vigia.yml/dispatches \
            -d '{"ref":"main"}' || true
