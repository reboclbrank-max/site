name: Testar todas as redes sociais
# Testa todas as credenciais de rede social usando os secrets do repositorio site
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: testar-todas-as-redes
  cancel-in-progress: false
jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Instala imapflow para teste de Gmail
        run: npm install imapflow --omit=dev --no-audit --no-fund
      - name: Gmail — as três perguntas (credencial · alcance · senha)
        # 16/11/2026: "Command failed" não diz nada ao dono. Este passo separa falta de
        # credencial, rede filtrada e senha recusada, e imprime o próximo passo exato.
        continue-on-error: true
        shell: bash -o pipefail -e {0}
        env:
          GMAIL_CHAT_ADDRESS: ${{ secrets.GMAIL_CHAT_ADDRESS }}
          GMAIL_CHAT_ADDR: ${{ secrets.GMAIL_CHAT_ADDRESS }}
          GMAIL_CHAT_APPPASS: ${{ secrets.GMAIL_CHAT_APPPASS }}
          GMAIL_CHAT_PASS: ${{ secrets.GMAIL_CHAT_PASS }}
        run: |
          set +e
          node tools/marketing/verificar-gmail.js | tee /tmp/gmail.txt
          codigo=${PIPESTATUS[0]}
          {
            echo "### Gmail: veredito"
            echo '```'
            cat /tmp/gmail.txt
            echo '```'
            echo ""
            echo "Documento com os passos: COMO-RESOLVER-GMAIL.md"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "código do verificador do Gmail: $codigo (0 ok · 2 falta secret · 3 rede · 4 senha recusada)"
          exit 0

      - name: Testa todas as APIs
        run: node tools/testar-todas-as-apis.js
        env:
          # 16/11/2026: o "GitHub PAT: HTTP 403" era o token de INTEGRAÇÃO, não o PAT. O secret
          # GHPAT existe desde 13/10 e nunca chegava ao teste. Agora chega.
          GITHUB_PAT: ${{ secrets.GHPAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          ITCH_API_KEYS: ${{ secrets.ITCH_API_KEYS }}
          ITCH_COOKIE: ${{ secrets.ITCH_COOKIE }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APPPASS: ${{ secrets.BLUESKY_APPPASS }}
          BSKY_APP_PASSWORD: ${{ secrets.BLUESKY_APPPASS }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_REFRESH_TOKEN: ${{ secrets.TUMBLR_REFRESH_TOKEN }}
          # Os quatro segredos do X vivem no repositório CHAT, não neste. Até 16/11/2026 este
          # workflow pedia secrets.X_* daqui: vinha vazio, o teste dizia "sem X_API_KEY" e o
          # dono achava que a credencial tinha caído. Vazio aqui é ausência de SECRET NO REPO,
          # não token inválido — o teste agora distingue os dois casos.
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          NOSTR_KEY: ${{ secrets.NOSTR_KEY }}
          # 16/11/2026: a casa usa DOIS nomes para a mesma credencial — o repo `site` guarda
          # GMAIL_CHAT_ADDRESS + GMAIL_CHAT_APPPASS; o repo `chat` guarda GMAIL_CHAT_ADDR +
          # GMAIL_CHAT_PASS. O teste lia só um par e dizia "sem credenciais" com credencial boa.
          GMAIL_CHAT_ADDRESS: ${{ secrets.GMAIL_CHAT_ADDRESS }}
          GMAIL_CHAT_ADDR: ${{ secrets.GMAIL_CHAT_ADDRESS }}
          GMAIL_CHAT_APPPASS: ${{ secrets.GMAIL_CHAT_APPPASS }}
          GMAIL_CHAT_PASS: ${{ secrets.GMAIL_CHAT_PASS }}
