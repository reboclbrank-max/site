name: limpar-youtube
# Apaga os vídeos de sonda das minhas medições. Nunca toca em vídeo do dono.
on:
  workflow_dispatch:
concurrency:
  group: limpar-youtube
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  limpar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Limpa
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 tools/limpar-youtube.py
