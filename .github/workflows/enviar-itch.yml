name: enviar-itch

# Envio de build para o itch.io pela ferramenta oficial (butler).
#
# Sem cron e com a palavra PUBLICAR obrigatória: build ao vivo substitui o que o jogador
# baixa. O modo padrão é `status`, que é SOMENTE LEITURA — mostra o que mudaria, sem enviar.
#
# O que este workflow NÃO faz (e não tem como fazer): criar página de jogo no itch e publicar
# devlog. O itch não expõe API para essas duas coisas; isso é só pelo site, na mão.
on:
  workflow_dispatch:
    inputs:
      jogo:
        description: "qual jogo (só existe build do ceifalume no repositório)"
        required: true
        default: ceifalume
        type: choice
        options:
          - ceifalume
      modo:
        description: "api = lista jogos e slugs · status = só leitura · push = envia"
        required: true
        default: status
        type: choice
        options:
          - status
          - api
          - push
      canal:
        description: "canal do itch (html5 é o padrão para jogo web)"
        required: true
        default: html5
      confirmacao:
        description: "para modo push, digite PUBLICAR"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: enviar-itch
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Barreiras offline (nenhuma toca a rede)
        run: |
          python3 tools/testes-enviar-itch.py
          python3 tools/testes-kit-youtube.py

      - name: Instala o butler (ferramenta oficial e gratuita do itch)
        run: |
          curl -sSL -o /tmp/butler.zip "https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default"
          mkdir -p /tmp/butler && unzip -q /tmp/butler.zip -d /tmp/butler
          chmod +x /tmp/butler/butler
          /tmp/butler/butler version
          echo "BUTLER_PATH=/tmp/butler/butler" >> "$GITHUB_ENV"

      - name: Status (somente leitura) ou envio confirmado
        env:
          ITCH_API_KEYS: ${{ secrets.ITCH_API_KEYS }}
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          if [ "${{ inputs.modo }}" = "api" ]; then
            python3 tools/enviar-itch.py api | tee /tmp/itch.txt
          elif [ "${{ inputs.modo }}" = "push" ]; then
            python3 tools/enviar-itch.py push "${{ inputs.jogo }}" "${{ inputs.canal }}" | tee /tmp/itch.txt
          else
            python3 tools/enviar-itch.py status "${{ inputs.jogo }}" | tee /tmp/itch.txt
          fi
          {
            echo "### itch.io — ${{ inputs.modo }} (${{ inputs.jogo }})"
            echo
            echo '```'
            cat /tmp/itch.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
