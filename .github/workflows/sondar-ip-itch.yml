name: sondar-ip-itch

# Mede, em IPs de runner DIFERENTES, se o painel do itch responde. O bloqueio conhecido é 403 em
# /dashboard vindo do runner ubuntu (Azure). Se outro sistema de runner passar, o passo que hoje
# depende do navegador do dono (editar página e postar devlog) pode ser automatizado de verdade.
#
# Só faz GET. Não escreve, não posta, não muda nada no itch.

on:
  workflow_dispatch:

concurrency:
  group: sondar-ip-itch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  medir:
    strategy:
      fail-fast: false
      matrix:
        sistema: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.sistema }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Mede o acesso ao painel com e sem sessão
        env:
          ITCH_COOKIE: ${{ secrets.ITCH_COOKIE }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error
          cookie = os.environ.get("ITCH_COOKIE", "").strip()
          UA = ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) "
                "Chrome/128.0.0.0 Safari/537.36")
          alvos = [
              "https://itch.io/",
              "https://itch.io/dashboard",
              "https://itch.io/game/edit/5017404",
          ]
          def req(url, com_cookie):
              h = {"User-Agent": UA, "Accept": "text/html"}
              if com_cookie and cookie:
                  h["Cookie"] = cookie
              r = urllib.request.Request(url, method="GET", headers=h)
              try:
                  resp = urllib.request.urlopen(r, timeout=45)
                  corpo = resp.read(2000).decode("utf-8", "replace")
                  return (resp.status, "desafio" if "just a moment" in corpo.lower() else "sem desafio")
              except urllib.error.HTTPError as e:
                  corpo = e.read(2000).decode("utf-8", "replace")
                  return (e.code, "desafio" if "just a moment" in corpo.lower() else "sem desafio")
              except Exception as e:
                  return (0, str(e)[:80])
          print("cookie:", ("presente (%d caracteres)" % len(cookie)) if cookie else "AUSENTE")
          for url in alvos:
              for com in (False, True):
                  if com and not cookie:
                      continue
                  print("%-46s cookie=%-5s -> %s" % (url, com, req(url, com)))
          PY

      - name: Resumo
        if: always()
        shell: bash
        run: echo "runner ${{ matrix.sistema }} medido"
