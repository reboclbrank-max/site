name: Publicar no Instagram

# Publicação autônoma no Instagram: cria container de mídia, aguarda o processamento
# ficar FINISHED e chama media_publish para colocar o post no ar.
#
# DISPARO: cron (dentro da janela 9-22h de Brasília) + repository_dispatch (chamado pelo
# pulso do marketing-24h quando decide publicar). Nunca exige confirmação manual.
#
# O container criado pela sonda-instagram expira em 24h se não for publicado. Este workflow
# fecha o ciclo: cria o container e publica de verdade.

on:
  # Janela 9-22h de Brasília (UTC-3): 12-23 e 0 em UTC
  schedule:
    - cron: "*/30 0,12-23 * * *"
  # O pulso do marketing-24h chama aqui quando decide que é hora de publicar no Instagram
  repository_dispatch:
    types: [publicar-instagram]
  workflow_dispatch:

permissions:
  # 16/11/2026: era `read`, e o portão não conseguia persistir o media_id — o commit era feito e
  # o push recusado 6 vezes ("autenticação/permissão"). O sintoma final era o mesmo de antes:
  # registro vazio na execução seguinte. `write` é o que permite versionar o próprio estado.
  contents: write

# 17/11/2026 — GRUPO COMPARTILHADO, NÃO GRUPO PRÓPRIO.
# Cada um destes arquivos declarava `concurrency: group: <o próprio nome>`, o que serializa
# execuções DO MESMO workflow e não faz nada entre workflows diferentes. Cinco workflows que
# gravam estado e empurram para o `main` corriam em paralelo e se atropelavam:
# medido em 17/11 02:53, quando o cobrador disparou os três de uma vez — status-total #6 e #7
# e alertas-proativos #3 morreram com "push recusado: concorrência/rejeição" seis vezes cada,
# tendo o commit feito e o dado fora do main.
# `entrar-no-main.sh` tem retry, mas retry disputando com mais quatro é revezamento, não
# publicação. Quem escreve no main precisa de UMA fila: o grupo `estado-no-main`.
concurrency:
  group: estado-no-main
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Contrato do publicador (offline)
        run: python3 tools/rodar-contratos-isolados.py tools/testes-sonda-instagram.py tools/testes-fase2-producao.py

      # ─── PORTÃO (16/11/2026) ───────────────────────────────────────────────────────────
      # Antes desta mudança o cron publicava a MESMA imagem com a MESMA legenda a cada 30
      # minutos, até 27 vezes por dia. Repetição é o que a Meta pune e é o que faz quem segue a
      # conta deixar de seguir. O portão aplica: 2h de intervalo mínimo, teto de 3/dia, janela
      # 9-22h de Brasília e deduplicação da peça (sha256 de imagem+legenda).
      - name: Portão do Instagram (intervalo, teto, janela, repetição)
        id: portao
        shell: bash -o pipefail -e {0}
        env:
          IG_IMAGE_URL: https://img.itch.zone/aW1hZ2UvNTAxNzQwNC8zMDA0MDAyNy5wbmc=/original/sNW2uy.png
          IG_CAPTION: "Postagem automática da casa — conteúdo gerado pelo ciclo de marketing.\n#Prancheta #Ceifalume #GamingDev"
          IG_INTERVALO_MINUTOS: "120"
          IG_TETO_DIARIO: "3"
        run: |
          set +e
          node tools/marketing/instagram-estado.js --pode \
            --imagem "$IG_IMAGE_URL" --legenda "$IG_CAPTION" | tee /tmp/portao.txt
          codigo=${PIPESTATUS[0]}
          {
            echo "### Portão do Instagram"
            echo '```'
            cat /tmp/portao.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "pode_publicar=$([ "$codigo" = 0 ] && echo sim || echo nao)" >> "$GITHUB_OUTPUT"
          echo "código do portão: $codigo"
          exit 0

      - name: Publica no Instagram (cria container → aguarda FINISHED → media_publish)
        # Sem a autorização do portão não há publicação: é o que impede o post repetido.
        if: ${{ steps.portao.outputs.pode_publicar == 'sim' }}
        shell: bash -o pipefail -e {0}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_IMAGE_URL: https://img.itch.zone/aW1hZ2UvNTAxNzQwNC8zMDA0MDAyNy5wbmc=/original/sNW2uy.png
          IG_CAPTION: Postagem automática da casa — conteúdo gerado pelo ciclo de marketing.\n#Prancheta #Ceifalume #GamingDev
          IG_PUBLICAR: 1
        run: |
          python3 tools/publicar-instagram.py | tee /tmp/publicar-instagram.json
          codigo=${PIPESTATUS[0]}
          {
            echo "### Publicação no Instagram"
            echo '```json'
            cat /tmp/publicar-instagram.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "código da publicação: $codigo"
          # 0 = publicado · 2 = ensaio (container pronto, não publicado) · 1 = erro
          if [ "$codigo" -ge 3 ]; then exit "$codigo"; fi
          exit 0

      # ─── MEMÓRIA E MEDIDA (16/11/2026) ────────────────────────────────────────────────
      # Publicar sem registrar é publicar duas vezes no dia seguinte. Aqui o media_id que a
      # Meta devolveu entra no portão (é ele que impede a repetição) e o fato da publicação
      # alimenta o auto-otimizador com o horário REAL em que a peça foi ao ar.
      - name: Registra o que foi publicado (portão + auto-otimizador)
        shell: bash -o pipefail -e {0}
        run: |
          set +e
          media_id=$(python3 -c 'import json;d=json.load(open("/tmp/publicar-instagram.json"));print((d.get("passos",{}).get("publicar") or {}).get("media_id") or "")' 2>/dev/null | tail -1)
          if [ -z "$media_id" ]; then
            echo "sem media_id (não publicou neste run) — nada a registrar"
            exit 0
          fi
          node tools/marketing/instagram-estado.js --registrar \
            --media-id "$media_id" \
            --imagem "$IG_IMAGE_URL" --legenda "$IG_CAPTION"
          hora=$(TZ=America/Sao_Paulo date +%-H)
          node tools/marketing/registrar.js --evento publicacao \
            --rede instagram --jogo ambos --hora "$hora" --quantidade 1 --origem cron
          {
            echo "### Registro da publicação"
            echo "- media_id: \`$media_id\`"
            echo "- hora de Brasília: ${hora}h"
            echo "- portão atualizado: sim (a próxima peça repetida será recusada)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Versiona o registro (é o que faz o portão lembrar amanhã)
        # SEM ESTE PASSO O PORTÃO É DECORATIVO. Ele grava o media_id no disco do runner e o
        # runner morre ali: na próxima execução o registro está vazio de novo e a MESMA peça
        # é publicada outra vez. Foi exatamente o sintoma reclamado (mesma arte a cada 30 min),
        # agora com a causa certa: não era falta de deduplicação, era falta de commit.
        env:
          GH_TOKEN: ${{ secrets.GHPAT }}
        run: |
          set -u
          git config user.name "rebocl"
          git config user.email "reboclbrank@gmail.com"
          for f in posts/marketing/instagram-publicados.json \
                   posts/marketing/registros-reais.json \
                   posts/marketing/auto-otimizador-avancado.json; do
            [ -e "$f" ] && git add "$f" || true
          done
          if git diff --cached --quiet; then
            echo "registro do Instagram sem mudança"
            exit 0
          fi
          git commit -q -m "instagram: media_id registrado ($(date -u +'%d/%m %H:%M UTC'))"
          # 17/11/2026 — `|| echo` AQUI ESCONDIA PERDA DE DADO.
          # Se o push falha, o run terminava VERDE com o estado fora do main:
          #   o media_id não entra no main → a próxima execução republica a MESMA peça.
          # Commit feito e não publicado é perda; perda silenciosa é pior que falha ruidosa.
          if ! bash tools/entrar-no-main.sh "registro do Instagram"; then
            echo "::error::estado gerado mas NÃO entrou no main — perdido neste run"
            exit 1
          fi
