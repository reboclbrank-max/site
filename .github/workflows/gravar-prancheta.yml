name: gravar-prancheta

# ⚽ Grava o PRANCHETA rodando (o segundo jogo da casa).
#
# Por que existe: até 27/10/2026 só o CEIFALUME tinha roteiro de gravação. O PRANCHETA existia
# publicado no itch.io (Godot web dentro do iframe do itch) e nada mais — "gravar o PRANCHETA"
# era promessa, não arquivo. O roteiro em tools/gravar-prancheta.js descobre o build atual na
# página do itch, atravessa menu → carreira → clube → staff → prancheta → partida e confere cada
# passo POR IMAGEM. Ele FALHA se menos de 4 passos essenciais mudarem a tela.
#
# REGRA DA CASA: gravar é produção, publicar não. O envio ao YouTube só com a palavra PUBLICAR.

on:
  workflow_dispatch:
    inputs:
      segundos:
        description: "duração da gravação em segundos"
        required: false
        default: "80"
      publicar:
        description: "PUBLICAR envia ao YouTube · ENSAIO roda todos os portões sem publicar · vazio = só gravar"
        required: false
        default: ""
  schedule:
    - cron: "50 2,10,18 * * *"   # 3 gravações por dia, só gravação

permissions:
  contents: write      # só para o registro do que foi publicado, atrás do cadeado PUBLICAR

concurrency:
  group: gravar-prancheta
  cancel-in-progress: false

jobs:
  gravar:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Ferramentas de captura e de medida
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm install --no-save --no-audit --no-fund playwright-core@1
          npx --yes playwright install chromium-headless-shell
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          # --with-deps é lento (apt completo) e já falhou por tempo; o headless-shell
          # roda no runner com as libs padrão do ubuntu-24.04 (medido no job do CEIFALUME).

      - name: Barreiras offline
        run: |
          node --check tools/gravar-prancheta.js
          python3 -m py_compile tools/prancheta-para-video.py tools/cena.py tools/desenhar-capa.py
          python3 tools/rodar-contratos-isolados.py tools/testes-prancheta.py
          python3 tools/rodar-contratos-isolados.py tools/testes-gameplay.py
          python3 tools/rodar-contratos-isolados.py tools/testes-cena.py

      - name: Escolhe a cena da vez (rotação do tools/cena.py)
        id: cena
        run: |
          ESTRATEGIA=$(python3 tools/cena.py proxima --jogo prancheta 2>/dev/null)
          echo "cena da vez: $ESTRATEGIA"
          echo "estrategia=$ESTRATEGIA" >> "$GITHUB_OUTPUT"

      - name: Grava o PRANCHETA (build web do itch, roteiro medido)
        env:
          SEGUNDOS_PEDIDO: ${{ github.event.inputs.segundos || '80' }}
          ESTRATEGIA: ${{ steps.cena.outputs.estrategia }}
        run: |
          node tools/gravar-prancheta.js \
            --saida media/gameplay/prancheta-cru.mp4 \
            --estrategia "$ESTRATEGIA" \
            --segundos "$SEGUNDOS_PEDIDO"

      - name: Pós-produção (legenda, trilha, cartão final)
        run: |
          python3 tools/produzir-video.py \
            media/gameplay/prancheta-cru.mp4 \
            media/gameplay/prancheta-cru-decisoes.json \
            media/gameplay/prancheta-gameplay.mp4 \
            --trechos "4-24,28-48,60-79"

      - name: Mede o vídeo final
        run: python3 tools/validar-video.py media/gameplay/prancheta-gameplay.mp4

      - name: Registra a partida (assinatura — cena repetida não entra)
        id: registro
        env:
          ESTRATEGIA: ${{ steps.cena.outputs.estrategia }}
        run: |
          # Recusa é comportamento certo: se a assinatura já está em posts/cenas.json, a
          # gravação é a mesma cena com outro carimbo. O run FALHA de propósito.
          if ! python3 tools/cena.py registrar --jogo prancheta \
                --relatorio media/gameplay/prancheta-cru-decisoes.json \
                --estrategia "$ESTRATEGIA" \
                --registro posts/cenas.json; then
            echo "::error::partida repetida: a assinatura desta gravação já está no registro"
            exit 1
          fi
          ASSINATURA=$(python3 -c "import json;d=json.load(open('posts/cenas.json',encoding='utf-8'));ps=[p for p in d['partidas'] if (p.get('jogo') or '')=='prancheta'];print(ps[-1]['assinatura'])")
          echo "assinatura=$ASSINATURA" >> "$GITHUB_OUTPUT"

      - name: Desenha a capa do vídeo (quadro do próprio vídeo)
        env:
          ESTRATEGIA: ${{ steps.cena.outputs.estrategia }}
          ASSINATURA: ${{ steps.registro.outputs.assinatura }}
        run: |
          TEXTO=$(python3 tools/prancheta-para-video.py --sem-kit --estrategia "$ESTRATEGIA" \
            --assinatura "$ASSINATURA")
          TITULO=$(echo "$TEXTO" | sed -n 's/^titulo: //p')
          NUMEROS=$(echo "$TEXTO" | sed -n 's/^capa_numeros: //p')
          echo "título da capa: $TITULO"
          # QUADRO DA CAPA: a prancheta tática, não o fim de jogo. Medido em 06/11/2026 na capa
          # do run 42275794636: o último quadro é a tela de resultado (0×3, saldo, cartões) —
          # informativa e ilegível no tamanho de miniatura. O quadro da prancheta mostra o campo
          # e as fichas, que é o que o jogo É. Se ele não existir, cai no quadro final.
          QUADRO=media/gameplay/prancheta-cru-prancheta.png
          if [ ! -s "$QUADRO" ]; then
            QUADRO=media/gameplay/prancheta-cru-quadro.png
          fi
          echo "quadro da capa: $QUADRO"
          python3 tools/desenhar-capa.py \
            --quadro "$QUADRO" \
            --saida media/gameplay/prancheta-capa.png \
            --titulo "$TITULO" \
            --numeros "$NUMEROS" \
            --assinatura "$ASSINATURA"

      - name: Monta o pacote do vídeo (título, descrição, tags)
        env:
          ESTRATEGIA: ${{ steps.cena.outputs.estrategia }}
          ASSINATURA: ${{ steps.registro.outputs.assinatura }}
        run: |
          python3 tools/prancheta-para-video.py \
            --estrategia "$ESTRATEGIA" \
            --assinatura "$ASSINATURA" \
            --capa media/gameplay/prancheta-capa.png \
            --kit posts/kit-gameplay.json

      - name: Guarda o registro no repositório (o vídeo vai como artefato, não como binário)
        # POLÍTICA NOVA (06/11/2026): o .mp4 deixa de entrar no git. Ele só é necessário DURANTE
        # o run que o produziu (é esse run que envia), e commitar 3 gravações por dia colocava
        # ~3,3 MB/dia de binário para sempre no histórico. O artefato do run guarda o arquivo.
        run: |
          git config user.name "reboclbrank-max"
          git config user.email "reboclbrank@gmail.com"
          git add media/gameplay/prancheta-cru-decisoes.json
          git add media/gameplay/prancheta-capa.png posts/cenas.json posts/kit-gameplay.json
          if git diff --cached --quiet; then
            echo "vídeo sem mudança"
            exit 0
          fi
          git commit -m "gameplay: PRANCHETA gravado ($(date -u +%d/%m\ %H:%M\ UTC))"
          # O push pode ser recusado se outro workflow commitar no main entre o checkout e
          # aqui — foi o que derrubou o run 41030633953 (30/10 09:05) e o que quase repetiu no
          # 41090257198. Duas lições medidas nesses dois runs:
          #   1) rebase recusa com "You have unstaged changes" porque o run deixa sobras na
          #      árvore (trechos, cru, quadro de prova) — então as sobras saem do caminho antes;
          #   2) falhar nas 3 tentativas NÃO pode passar batido: sem o `exit 1` o run terminava
          #      verde com o vídeo fora do repositório.
          git stash push -u -q -m "sobras-do-run" >/dev/null 2>&1 || true
          enviado=0
          for tentativa in 1 2 3; do
            if git fetch -q origin main && git rebase -q origin/main && git push; then
              echo "vídeo registrado no main (tentativa $tentativa)"
              enviado=1
              break
            fi
            echo "push recusado (tentativa $tentativa) — rebase e nova tentativa"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          if [ "$enviado" != "1" ]; then
            echo "::error::3 tentativas e o vídeo não entrou no main (o arquivo existe só neste run)"
            exit 1
          fi
          git log --oneline -1

      - name: Guarda o vídeo e o quadro de prova
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gameplay-prancheta
          path: |
            media/gameplay/prancheta-gameplay.mp4
            media/gameplay/prancheta-cru.mp4
            media/gameplay/prancheta-cru-decisoes.json
            media/gameplay/prancheta-capa.png
          retention-days: 14

      - name: Resumo
        env:
          STATUS_PUBLICACAO: ${{ github.event.inputs.publicar == 'PUBLICAR' && 'pedido neste run' || 'não pedido — só gravação' }}
        run: |
          {
            echo "### PRANCHETA gravado"
            echo
            echo '```'
            ffprobe -hide_banner -v error -show_entries format=duration,size:stream=width,height,r_frame_rate \
              -of default=noprint_wrappers=1 media/gameplay/prancheta-gameplay.mp4
            echo '```'
            echo
            echo "Cena da vez: ${{ steps.cena.outputs.estrategia }} · assinatura ${{ steps.registro.outputs.assinatura }}"
            echo
            echo "Envio ao YouTube: $STATUS_PUBLICACAO"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensaio do envio (roda todos os portões e não publica)
        # O caminho de envio do PRANCHETA nunca tinha rodado. Ensaio valida kit, arquivo, capa,
        # impressão, título novo e a régua do texto — e para antes de pedir token. Não usa
        # segredo nenhum: se o ensaio depender de credencial, ele não prova nada.
        if: ${{ github.event.inputs.publicar == 'ENSAIO' }}
        env:
          CONFIRMACAO: ENSAIO
          KIT_YOUTUBE: posts/kit-gameplay.json
        run: |
          set +e
          python3 tools/enviar-youtube.py prancheta-gameplay | tee /tmp/ensaio.txt
          codigo=${PIPESTATUS[0]}
          {
            echo "### Ensaio do envio do PRANCHETA (nada foi publicado)"
            echo '```'
            cat /tmp/ensaio.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "código do ensaio: $codigo"

      - name: Envia ao YouTube (só com a palavra PUBLICAR)
        # Até 06/11/2026 este workflow tinha o campo PUBLICAR e NENHUM passo de envio: o resumo
        # dizia "pedido neste run" e nada saía. Promessa falsa. Agora o envio é este passo, com
        # o mesmo cadeado e o mesmo portão do CEIFALUME (o vídeo só sobe se for novo).
        if: ${{ github.event.inputs.publicar == 'PUBLICAR' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CONFIRMACAO: ${{ github.event.inputs.publicar }}
          KIT_YOUTUBE: posts/kit-gameplay.json
        run: |
          python3 tools/enviar-youtube.py prancheta-gameplay | tee /tmp/envio.txt

      - name: Registra o que foi publicado (JSON público)
        if: ${{ github.event.inputs.publicar == 'PUBLICAR' }}
        run: |
          if [ ! -f posts/youtube-publicados.json ]; then
            echo "sem registro para guardar (o envio pode ter falhado antes)"
            exit 0
          fi
          git config user.name "reboclbrank-max"
          git config user.email "reboclbrank@gmail.com"
          git add posts/youtube-publicados.json
          [ -e posts/videos-enviados.json ] && git add posts/videos-enviados.json || true
          if git diff --cached --quiet; then
            echo "registro sem mudança"
            exit 0
          fi
          git commit -m "registro: vídeo do PRANCHETA publicado no YouTube ($(date -u +'%d/%m %H:%M UTC'))"
          git stash push -u -q -m "sobras-do-run" >/dev/null 2>&1 || true
          enviado=0
          for tentativa in 1 2 3; do
            if git fetch -q origin main && git rebase -q origin/main && git push; then
              echo "registro no main (tentativa $tentativa)"
              enviado=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          if [ "$enviado" != "1" ]; then
            echo "::error::3 tentativas e o registro não entrou no main"
            exit 1
          fi
