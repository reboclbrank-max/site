name: editar-itch

# Edita a PAGINA do itch.io (texto, resumo, tags, genero) — o que a API nao oferece.
# Funciona por sessao (segredo ITCH_COOKIE), que passa porque /dashboard nao e desafiado pelo
# Cloudflare; so /login e, e por isso o login nunca e automatizado aqui.
#
# Travas:
#   - modo padrao 'ler': so mostra os campos atuais, nao escreve nada;
#   - escrever exige a palavra EDITAR no campo de confirmacao;
#   - antes de escrever, o run publica posts/backup-itch.json com os valores anteriores;
#   - depois de escrever, rele a pagina publica e diz o que de fato mudou.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "ler = so mostra · aplicar = escreve (exige EDITAR)"
        required: true
        default: ler
        type: choice
        options:
          - ler
          - aplicar
      caminho:
        description: "caminho da pagina de edicao, ex.: /dashboard/game/123456/edit"
        required: true
        default: "/dashboard/game/0/edit"
      titulo:
        description: "novo titulo (vazio = nao mexe)"
        required: false
        default: ""
      resumo:
        description: "nova frase curta (vazio = nao mexe)"
        required: false
        default: ""
      confirmacao:
        description: "para escrever, digite EDITAR"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: editar-itch
  cancel-in-progress: false

jobs:
  editar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Barreiras offline (nenhuma toca a rede)
        run: |
          python3 tools/testes-itch-navegador.py
          python3 tools/testes-administrar-itch.py

      - name: Le ou aplica
        env:
          ITCH_COOKIE: ${{ secrets.ITCH_COOKIE }}
          ITCH_API_KEYS: ${{ secrets.ITCH_API_KEYS }}
          ITCH_EDICAO: ${{ inputs.caminho }}
          MODO: ${{ inputs.modo }}
          TITULO: ${{ inputs.titulo }}
          RESUMO: ${{ inputs.resumo }}
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          set -o pipefail
          {
          # caminho vazio = descobre pelo ID real do jogo na API do itch (nada de chutar numero)
          if [ -z "$ITCH_EDICAO" ] || [ "$ITCH_EDICAO" = "/dashboard/game/0/edit" ]; then
            ITCH_EDICAO=$(python3 - <<'PY'
          import importlib.util, os, sys
          spec = importlib.util.spec_from_file_location("adm", "tools/administrar-itch.py")
          adm = importlib.util.module_from_spec(spec); spec.loader.exec_module(adm)
          chave = os.environ.get("ITCH_API_KEYS", "")
          dados, _ = adm.itch._get_json("https://api.itch.io/profile/games", chave)
          for g in (dados or {}).get("games") or []:
              if (g.get("url") or "").rstrip("/").endswith("/ceifalume"):
                  print("/dashboard/game/%s/edit" % g["id"])
          PY
            )
            echo "caminho descoberto pela API: $ITCH_EDICAO"
          fi
          export ITCH_EDICAO
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "tools")
          import importlib.util
          spec = importlib.util.spec_from_file_location("nav", "tools/itch-navegador.py")
          nav = importlib.util.module_from_spec(spec); spec.loader.exec_module(nav)

          cookie = os.environ.get("ITCH_COOKIE", "")
          alvo = os.environ.get("ITCH_EDICAO", "")
          modo = os.environ.get("MODO", "ler")
          print("cookie: " + nav.resumir_cookie(cookie))
          ok, msg = nav.sessao_ok(cookie)
          print(("OK " if ok else "FALHOU ") + "sessao: " + msg)
          if not ok:
              sys.exit(1)
          estado, erro = nav.ler(alvo, cookie)
          if erro:
              print("FALHOU leitura: " + erro); sys.exit(1)
          print("campos do itch: " + ", ".join(estado["_campos_do_itch"]))
          for rotulo in nav.MAPA.values():
              if rotulo in estado:
                  v = estado[rotulo]
                  print("  %s = %s" % (rotulo, (str(v)[:90] + "...") if v and len(str(v)) > 90 else v))
          if modo != "aplicar":
              print("- modo ler: nada foi escrito")
              sys.exit(0)
          mudancas = {}
          if os.environ.get("TITULO"): mudancas["titulo"] = os.environ["TITULO"]
          if os.environ.get("RESUMO"): mudancas["resumo"] = os.environ["RESUMO"]
          if not mudancas:
              print("FALHOU aplicar sem nenhum campo novo"); sys.exit(1)
          ok2, msg2, backup = nav.aplicar(alvo, mudancas, cookie, confirmacao=os.environ.get("CONFIRMACAO", ""))
          if backup:
              import json
              os.makedirs("posts", exist_ok=True)
              with open("posts/backup-itch.json", "w", encoding="utf-8") as f:
                  json.dump(backup, f, ensure_ascii=False, indent=2)
              print("backup dos valores anteriores escrito em posts/backup-itch.json")
              for k, v in backup.items():
                  print("  antes: %s = %s" % (k, (str(v)[:70] + "...") if v and len(str(v)) > 70 else v))
          print(("OK " if ok2 else "FALHOU ") + msg2)
          sys.exit(0 if ok2 else 1)
          PY
          } 2>&1 | tee /tmp/edicao.txt

      - name: Resumo do run
        if: always()
        env:
          MODO: ${{ inputs.modo }}
        run: |
          {
            echo "### itch.io — pagina ($MODO)"
            echo
            echo '```'
            python3 -c "print(open('/tmp/edicao.txt').read())" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # O chat le posts/estado-itch.json para responder o !itch com o resultado de verdade.
      # So grava quando o resultado muda (o carimbo de tempo sozinho nao gera commit).
      - name: Registra o estado para o chat
        if: always()
        continue-on-error: true
        env:
          MODO: ${{ inputs.modo }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          try:
              saida = Path('/tmp/edicao.txt').read_text(encoding='utf-8', errors='replace')
          except OSError:
              saida = ''
          linhas = [l.strip() for l in saida.splitlines() if l.strip()]
          antes = {}
          alvo = Path('posts/estado-itch.json')
          if alvo.exists():
              try:
                  antes = json.loads(alvo.read_text(encoding='utf-8'))
              except ValueError:
                  antes = {}

          def achar(prefixos):
              for linha in linhas:
                  if linha.startswith(prefixos):
                      return linha
              return ''

          estado = {
              'quando': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'modo': os.environ.get('MODO', 'ler'),
              'caminho': next((l.split(':', 1)[1].strip() for l in linhas
                               if l.startswith('caminho descoberto pela API')), '') or os.environ.get('ITCH_EDICAO', ''),
              'cookie': next((l.split(':', 1)[1].strip() for l in linhas if l.startswith('cookie:')), 'desconhecido'),
              'sessao': achar(('OK sessao', 'FALHOU sessao')),
              'resultado': ([l for l in linhas if l.startswith(('OK ', 'FALHOU '))] or [''])[-1],
              'resumo': linhas[-6:],
              'run': '%s/%s/actions/runs/%s' % (os.environ.get('GITHUB_SERVER_URL', 'https://github.com'),
                                                os.environ.get('GITHUB_REPOSITORY', ''), os.environ.get('GITHUB_RUN_ID', '')),
          }
          comparavel = {k: v for k, v in estado.items() if k != 'quando'}
          if not linhas:
              print('sem saida do passo principal: nada a registrar')
              raise SystemExit(0)
          if comparavel == {k: v for k, v in antes.items() if k != 'quando'}:
              print('estado igual ao anterior: nada a registrar')
              raise SystemExit(0)
          alvo.parent.mkdir(parents=True, exist_ok=True)
          alvo.write_text(json.dumps(estado, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('estado gravado em posts/estado-itch.json: ' + estado['resultado'])
          PY
          git config user.name "editar-itch"
          git config user.email "actions@users.noreply.github.com"
          git add posts/estado-itch.json
          if git diff --cached --quiet; then echo "nada a commitar"; exit 0; fi
          git commit -m "itch: estado do run ($MODO)"
          for tentativa in 1 2 3; do
            if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then
              echo "estado registrado no main"; exit 0
            fi
            sleep 5
          done
          echo "aviso: nao consegui registrar o estado (o run em si ja terminou)"
