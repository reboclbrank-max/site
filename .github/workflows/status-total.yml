name: status-total

# 📋 STATUS TOTAL — o relatório integrado do marketing, gerado em produção.
#
# POR QUE ESTE WORKFLOW EXISTE (16/11/2026):
# `!status-total` existia como comando no chat: alguém precisava digitar para saber o estado da
# casa. O pedido do dono é autonomia — o relatório tem que existir sem ninguém pedir. Aqui ele
# roda 3x por dia, junta health check + alertas + orquestrador + otimizador numa página única,
# publica no resumo do run e versiona em `posts/marketing/status-total.json`.
#
# Ele NÃO decide nada e NÃO publica em rede nenhuma: é leitura. O valor é ser o lugar onde o
# dono olha uma vez e entende o dia.

on:
  schedule:
    # 10:00, 15:00 e 21:00 de Brasília (13, 18 e 0 UTC) — antes e depois dos horários de
    # publicação, para o dono ver o dia acontecendo.
    - cron: "0 0,13,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status-total
  cancel-in-progress: false

jobs:
  relatorio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Contratos da Fase 2 (offline)
        run: python3 tools/rodar-contratos-isolados.py tools/testes-fase2-producao.py

      # ── O DADO REAL QUE O OTIMIZADOR PRECISA ──────────────────────────────────────────
      # 17/11/2026: `metricas_engajamento` vivia vazio porque ninguém COLETAVA engajamento —
      # só se registrava "publiquei às Xh". Sem curtida/vídeo assistido, `calcularCadencia()`
      # usava metade da informação e o "auto-otimizador" não otimizava: media.
      # Este passo lê as redes (Instagram Graph, YouTube Data) e grava o que elas devolveram.
      # `continue-on-error` porque API de terceiro fora do ar não é defeito desta casa — mas o
      # código do coletor vai para o resumo (0 ok · 2 nada a coletar · 3 falha/credencial).
      - name: Coleta o engajamento real (alimenta o auto-otimizador)
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          set +e
          node tools/marketing/coletar-engajamento.js | tee /tmp/engajamento.txt
          codigo=${PIPESTATUS[0]}
          {
            echo "### Engajamento real coletado"
            echo '```'
            cat /tmp/engajamento.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "código do coletor: $codigo (0 coletou · 2 nada a coletar · 3 falha)"
          exit 0

      - name: Gera o relatório integrado
        shell: bash -o pipefail -e {0}
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GMAIL_CHAT_APPPASS: ${{ secrets.GMAIL_CHAT_APPPASS }}
          NOSTR_KEY: ${{ secrets.NOSTR_KEY }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          BLUESKY_APPPASS: ${{ secrets.BLUESKY_APPPASS }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GMAIL_CHAT_PASS: ${{ secrets.GMAIL_CHAT_PASS }}
          GMAIL_CHAT_ADDRESS: ${{ secrets.GMAIL_CHAT_ADDRESS }}
          GMAIL_CHAT_ADDR: ${{ secrets.GMAIL_CHAT_ADDR }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ITCH_API_KEYS: ${{ secrets.ITCH_API_KEYS }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          GHPAT: ${{ secrets.GHPAT }}
        run: |
          set +e
          node tools/marketing/status-total-marketing.js --resumo | tee /tmp/status.txt
          codigo=${PIPESTATUS[0]}
          {
            echo "### Status total do marketing"
            echo '```'
            cat /tmp/status.txt
            echo '```'
            echo ""
            echo "### Dados reais que alimentam o auto-otimizador"
            echo '```'
            node tools/marketing/registrar.js --resumo
            echo '```'
            echo ""
            echo "### Portão do Instagram"
            echo '```'
            node tools/marketing/instagram-estado.js --resumo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "código do status: $codigo"
          if [ "$codigo" -ge 3 ]; then exit "$codigo"; fi
          exit 0

      - name: Guarda o relatório no repositório
        shell: bash -o pipefail -e {0}
        run: |
          git config user.name "rebocl"
          git config user.email "reboclbrank@gmail.com"
          for f in posts/marketing/status-total.json posts/marketing/auto-otimizador-avancado.json \
                   posts/marketing/instagram-publicados.json; do
            [ -e "$f" ] && git add "$f" || true
          done
          if git diff --cached --quiet; then
            echo "status sem mudança"
            exit 0
          fi
          git commit -q -m "status total: relatório $(date -u +'%d/%m %H:%M UTC')"
          # 17/11/2026 — ESTE `|| echo` ESCONDIA PERDA DE DADO.
          # Quando o push morria, o run terminava VERDE com o relatório fora do main. Foi
          # exatamente o que aconteceu no #4: 13 visualizações do YouTube coletadas, commit
          # feito, push recusado 6×, e o run dizendo "success". Um observador do painel
          # concluiria que o dado estava lá. Não estava.
          # Regra: se o dado foi gerado e não entrou no main, o run FALHA. Commit feito e não
          # publicado é perda — e perda silenciosa é pior que falha ruidosa.
          if ! bash tools/entrar-no-main.sh "status total"; then
            echo "::error::o relatório foi gerado mas NÃO entrou no main — dado perdido neste run"
            exit 1
          fi
