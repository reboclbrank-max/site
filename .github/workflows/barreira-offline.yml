name: Barreira offline de operação
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tools/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: barreira-offline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  conferir:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Dependências da mesma barreira de produção
        run: python3 -m pip install --disable-pip-version-check Pillow==12.0.0 PyYAML==6.0.2
      - name: Regressões em cópias isoladas, sem segredos
        run: |
          python3 tools/rodar-contratos-isolados.py tools/testes-dependencias-barreira.py tools/testes-gif-com-selo.py tools/testes-bancada-isolada.py tools/testes-workflows.py
