name: metricas-youtube

# 📈 Mede o que os vídeos publicados fizeram (views, likes, comentários).
#
# Por que existe: o envio ao YouTube registrava id e título, e depois disso nada era medido.
# Este workflow lê a YouTube Data API (dados públicos, chave YT_API_KEY) dos ids registrados em
# posts/youtube-publicados.json e grava posts/youtube-metricas.json, que o chat lê com !views.
#
# REGRA: se a API não responder, o workflow FALHA e não reescreve o JSON. Número velho com data
# nova seria mentira; número nenhum é honesto.

on:
  workflow_dispatch:
  schedule:
    - cron: "40 3,9,15,21 * * *"   # 4 leituras por dia

permissions:
  contents: write

concurrency:
  group: metricas-youtube
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Barreira offline do medidor
        run: |
          python3 -m py_compile tools/metricas-youtube.py
          python3 tools/testes-metricas-youtube.py

      - name: Mede os vídeos publicados
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 tools/metricas-youtube.py

      - name: Guarda o número medido
        run: |
          git config user.name "reboclbrank-max"
          git config user.email "reboclbrank@gmail.com"
          git add posts/youtube-metricas.json
          if git diff --cached --quiet; then
            echo "sem mudança nas métricas"
            exit 0
          fi
          git commit -m "metricas do YouTube: $(date -u +%d/%m\ %H:%M\ UTC)"
          git stash push -u -q -m "sobras-do-run" >/dev/null 2>&1 || true
          enviado=0
          for tentativa in 1 2 3; do
            if git fetch -q origin main && git rebase -q origin/main && git push; then
              echo "registro no main (tentativa $tentativa)"
              enviado=1
              break
            fi
            echo "push recusado (tentativa $tentativa) — rebase e nova tentativa"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          if [ "$enviado" != "1" ]; then
            echo "::error::3 tentativas e o registro não entrou no main"
            exit 1
          fi
