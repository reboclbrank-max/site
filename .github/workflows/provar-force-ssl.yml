name: provar-force-ssl
# Mede, com o token do cliente novo (escopo force-ssl), se comentários e legendas abriram.
# Não responde nada: só lê.
on:
  workflow_dispatch:
concurrency:
  group: provar-force-ssl
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  provar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Mede
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID3 }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET3 }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN3 }}
        run: python3 tools/conferir-comentarios.py
