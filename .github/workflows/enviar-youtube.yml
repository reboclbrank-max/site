name: enviar-youtube

# Envia ao YouTube o vídeo de um jogo da casa, usando o pacote do kit.
#
# REGRA DA CASA: publicação só com pedido explícito. Por isso este workflow NÃO tem cron e
# exige a palavra PUBLICAR no campo de confirmação — sem ela, o script sai com erro antes de
# qualquer requisição. O kit (título, descrição, tags, arquivo) é a única fonte de texto.
#
# PORTA FECHADA (06/11/2026): este workflow envia o arquivo que está COMMITADO no repositório.
# O vídeo do PRANCHETA é gravado a cada run, então o que está no git é sempre uma partida velha
# — pedir "prancheta" aqui é recusado, com o motivo, pela própria ferramenta de envio.
# Quem grava e envia o PRANCHETA é o gravar-prancheta.yml, no mesmo run.
on:
  workflow_dispatch:
    inputs:
      jogo:
        description: "qual jogo enviar (prancheta só pelo gravar-prancheta.yml)"
        required: true
        default: ceifalume
        type: choice
        options:
          - ceifalume
          - prancheta
      confirmacao:
        description: "digite PUBLICAR para confirmar o envio"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: enviar-youtube
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Barreiras offline (nenhuma toca a rede)
        run: |
          python3 tools/rodar-contratos-isolados.py tools/testes-kit-youtube.py
          python3 tools/rodar-contratos-isolados.py tools/testes-youtube-oauth.py

      - name: O kit precisa estar válido antes de qualquer envio
        run: python3 tools/kit-youtube.py

      - name: Envia o vídeo do jogo escolhido
        shell: bash -o pipefail -e {0}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CONFIRMACAO: ${{ inputs.confirmacao }}
          JOGO_PEDIDO: ${{ inputs.jogo }}
        run: |
          python3 tools/enviar-youtube.py "$JOGO_PEDIDO" | tee /tmp/envio.txt
          {
            echo "### Envio ao YouTube"
            echo
            echo '```'
            cat /tmp/envio.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
