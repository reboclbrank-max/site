	<script>
/* Ceifalume — camada mobile da página de teste.
   Tudo aqui é em torno do jogo, não dentro dele. Se alguma função falhar no

(function () {
	'use strict';

	var config = {
		// Carimbão do build: é o que diz ao dono qual rascunho ele está jogando.
		selo: 'rascunho 2026-09-15 · rev C · Semana 6',

		return el;

	/* ---------- 1. tela de carregamento com porcentagem grande ---------- */
	(function carga() {
		var status = $('status');
		if (!status) return;

		var monograma =
			'<svg viewBox="0 0 240 240" aria-hidden="true" focusable="false">' +
			'<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
			'<stop offset="0" stop-color="#f0d97a"/><stop offset=".5" stop-color="#d4af37"/>' +
			'<stop offset="1" stop-color="#9c7a24"/></linearGradient></defs>' +
			'<text x="120" y="150" text-anchor="middle" font-family="Georgia,\'Times New Roman\',serif" ' +
			'font-size="118" font-weight="bold" fill="url(#g)">RB</text></svg>';

		var bloco = criar('div', 'rd-carga', 'rd-carga',
			monograma +
			'<h1>Ceifalume</h1>' +
			'<p id="rd-carga-texto">preparando a fazenda…</p>' +
			'<p class="rd-dica">s\u00e3o uns 35&nbsp;MB de cada vez — em Wi-Fi vai bem mais r\u00e1pido</p>');
		status.insertBefore(bloco, status.firstChild);

		var barra = $('status-progress');
		var texto = $('rd-carga-texto');
		if (!barra || !texto) return;

		function atualizar() {
			var atual = Number(barra.value) || 0;
			var total = Number(barra.max) || 0;
			if (atual > 0 && total > 0) {
				var mb = (atual / 1048576).toFixed(1);
				var totalMb = (total / 1048576).toFixed(1);
				var pct = Math.min(99, Math.round((atual / total) * 100));
				texto.textContent = 'baixando o motor… ' + pct + '% (' + mb + ' de ' + totalMb + ' MB)';
			} else {
				texto.textContent = 'preparando a fazenda…';
			}
		}

		if (window.MutationObserver) {
			new MutationObserver(atualizar).observe(barra, {
				attributes: true,
				attributeFilter: ['value', 'max'],
			});
		}
		atualizar();
	}());

		botaoCheio.type = 'button';

				ui.appendChild(caixa);
			}
			caixa.innerHTML = '<strong>' + titulo + '</strong>';
			caixa.appendChild(criar('code', null, null, String(detalhe || 'sem detalhes')));
			var recomecar = criar('button', null, null, 'Tentar de novo');
			recomecar.type = 'button';
			recomecar.addEventListener('click', function () { location.reload(); });
			var fechar = criar('button', null, null, 'Fechar aviso');
			fechar.type = 'button';
			fechar.addEventListener('click', function () { caixa.setAttribute('hidden', ''); });
			caixa.appendChild(recomecar);
			caixa.appendChild(fechar);
		}
		window.addEventListener('unhandledrejection', function (e) {
			mostrar('Algo quebrou ao abrir o jogo', (e.reason && e.reason.message) || e.reason);
		});
		window.addEventListener('error', function (e) {
			// ignora ruído de recurso (favicon ausente etc.), que não impede nada
			if (e && e.target && e.target !== window && e.target.tagName) return;
			mostrar('Erro no jogo', (e && e.message) || 'desconhecido');
		});
	}());

	/* ---------- 4. não deixar o celular dormir no meio do teste ---------- */
	(function vela() {
		var guarda = null;
		function pedir() {
			if (!navigator.wakeLock || document.hidden) return;
			navigator.wakeLock.request('screen').then(function (s) { guarda = s; }).catch(function () {});
		}
		document.addEventListener('visibilitychange', function () {
			if (document.hidden) {
				if (guarda) { try { guarda.release(); } catch (e) {} guarda = null; }
			} else {
				pedir();
			}
		});
		pedir();
	}());

	/* ---------- 5. girou o aparelho → reenvia o tamanho ao motor ---------- */
	window.addEventListener('orientationchange', function () {
		setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 300);
	});
}());
	</script>
	</body>
