<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<title>🏛 Comitê no Bolso — Rebocl Brank</title>
<style>
  :root{--preto:#0a0a0a;--preto-2:#0f0e0c;--preto-3:#14120e;--dourado:#d4af37;
    --dourado-claro:#f0d97a;--dourado-escuro:#9c7a24;--texto:#e8e6e1;--suave:#9d9a93;
    --borda:rgba(212,175,55,.32)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--preto);color:var(--texto);font-family:"Segoe UI",Roboto,Arial,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:60px}
  header{text-align:center;padding:38px 5% 24px;border-bottom:1px solid var(--borda)}
  .linha{font-size:.72rem;letter-spacing:.5em;text-transform:uppercase;color:var(--dourado-escuro)}
  h1{font-size:clamp(1.4rem,5vw,2rem);font-weight:300;letter-spacing:.2em;color:var(--dourado);margin-top:8px}
  .sub{color:var(--suave);font-size:.9rem;margin-top:10px}
  main{width:min(860px,92%);margin:0 auto}
  textarea{width:100%;min-height:110px;background:var(--preto-3);color:var(--dourado-claro);
    border:1px solid var(--borda);border-radius:12px;padding:14px;font-size:16px;margin-top:24px;resize:vertical}
  button{width:100%;padding:16px;margin-top:14px;background:var(--dourado);color:#0a0a0a;border:0;
    border-radius:12px;font-size:17px;font-weight:700;letter-spacing:.06em;cursor:pointer}
  button:disabled{opacity:.5}
  #placar{text-align:center;color:var(--suave);margin-top:16px;font-size:.95rem;min-height:1.4em}
  .robo{background:var(--preto-2);border:1px solid var(--borda);border-radius:12px;
    padding:14px 16px;margin-top:14px}
  .robo h3{font-size:.95rem;color:var(--dourado-claro);display:flex;justify-content:space-between;gap:8px}
  .robo .tempo{color:var(--suave);font-weight:400;font-size:.82rem}
  .robo p{margin-top:8px;white-space:pre-wrap;font-size:.95rem}
  .estado{color:var(--suave);font-style:italic}
  .vencedor{border-color:var(--dourado);box-shadow:0 0 18px rgba(212,175,55,.25)}
  .selo{background:var(--dourado);color:#0a0a0a;border-radius:6px;padding:1px 8px;font-size:.75rem;font-weight:700}
  footer{text-align:center;color:var(--suave);font-size:.8rem;padding:34px 10% 0;border-top:1px solid var(--borda);margin-top:40px}
  footer a{color:var(--dourado-claro)}
</style>
</head>
<body>
<header>
  <span class="linha">Rebocl Brank</span>
  <h1>🏛 Comitê no Bolso</h1>
  <p class="sub">A pergunta sai do SEU celular para todos os motores ao mesmo tempo.<br>
  Sem chave, sem conta, sem IP queimado — residencial é poder.</p>
</header>
<main>
  <textarea id="pergunta" placeholder="Sua pergunta para o comitê…"></textarea>
  <button id="disparar" onclick="disparar()">🏛 CONVOCAR O COMITÊ</button>
  <div id="placar"></div>
  <div id="saidas"></div>
</main>
<footer>
  Os motores gratuitos têm limites — se um fechar a janela, outro responde.<br>
  <a href="../blog/">Diário de bordo</a> · <a href="../">site oficial</a>
</footer>
<script>
const LLM7 = ["GLM-5.3-Flash","glm-5.3","gpt-oss:20b","nemotron-3-nano:30b","mistral-Nemo-Instruct-2407",
  "codestral-latest","DeepSeek-V4-Flash-0731","gemma4:31b","minimax-m3","kimi-k2.6",
  "L3-8B-Lunaris-v1-Turbo","mistral-Small-24B-Instruct-2501", "chroma-v.46-flash", "jev-latest", "dark-beast-krea2", "gemini-omni-flash", "default", "fast"];
const OVH = ["Qwen3.5-397B-A17B","Meta-Llama-3_3-70B-Instruct","gpt-oss-120b","Qwen3.6-27B",
  "Mistral-Small-3.2-24B-Instruct-2506","Qwen3.5-9B","gpt-oss-20b"];
const ROBOS = [
  ...LLM7.map(m => ({nome: "LLM7 · " + m, tipo: "llm7", modelo: m})),
  ...OVH.map(m => ({nome: "OVH · " + m, tipo: "ovh", modelo: m})),
];
const BASES = {llm7: "https://api.llm7.io/v1", ovh: "https://oai.endpoints.kepler.ai.cloud.ovh.net/v1"};

function caixa(nome) {
  const d = document.createElement("div");
  d.className = "robo"; d.id = "r-" + btoa(nome).replace(/=/g, "");
  d.innerHTML = "<h3><span>" + nome + "</span><span class='tempo'>&#8203;</span></h3><p class='estado'>⏳ convocando…</p>";
  document.getElementById("saidas").appendChild(d);
  return d;
}
function escreve(nome, html, cls) {
  const d = document.getElementById("r-" + btoa(nome).replace(/=/g, ""));
  if (!d) return;
  if (cls) d.classList.add(cls);
  if (cls === "vencedor") d.querySelector("h3 span").insertAdjacentHTML("beforeend", " <span class='selo'>★ MELHOR</span>");
  d.querySelector("p").outerHTML = "<p>" + html + "</p>";
}
function tempo(nome, t0) {
  const el = document.getElementById("r-" + btoa(nome).replace(/=/g, ""));
  if (el) el.querySelector(".tempo").textContent = ((Date.now() - t0) / 1000).toFixed(1) + "s";
}
async function um(robo, pergunta, t0) {
  escreve(robo.nome, "<span class='estado'>⏳ pensando…</span>");
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 90000);
  try {
    const r = await fetch(BASES[robo.tipo] + "/chat/completions", {
      method: "POST", signal: ctrl.signal,
      headers: {"Content-Type": "application/json", "Authorization": "Bearer unused"},
      body: JSON.stringify({model: robo.modelo, messages: [{role: "user", content: pergunta}], max_tokens: 400})
    });
    clearTimeout(timer); tempo(robo.nome, t0);
    if (!r.ok) { escreve(robo.nome, "<span class='estado'>🚫 janela fechada (HTTP " + r.status + ")</span>"); return null; }
    const d = await r.json();
    const m = (d.choices || [{}])[0].message || {};
    const txt = (m.content || m.reasoning_content || "").trim();
    if (!txt) { escreve(robo.nome, "<span class='estado'>🤫 respondeu vazio</span>"); return null; }
    const escapado = txt.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    escreve(robo.nome, escapado);
    return {nome: robo.nome, txt};
  } catch (e) {
    clearTimeout(timer); tempo(robo.nome, t0);
    escreve(robo.nome, "<span class='estado'>💀 " + (e.name === "AbortError" ? "tempo esgotado (90s)" : "sem resposta") + "</span>");
    return null;
  }
}
async function disparar() {
  const pergunta = document.getElementById("pergunta").value.trim();
  if (!pergunta) { document.getElementById("pergunta").focus(); return; }
  const btn = document.getElementById("disparar");
  btn.disabled = true;
  document.getElementById("saidas").innerHTML = "";
  const t0 = Date.now();
  const respostas = (await Promise.all(ROBOS.map(r => um(r, pergunta, t0)))).filter(Boolean);
  const placar = document.getElementById("placar");
  if (respostas.length) {
    const melhor = respostas.reduce((a, b) => (b.txt.length > a.txt.length && b.txt.length > 200 ? b : a));
    if (melhor.txt.length > 200) escreve(melhor.nome, melhor.txt.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"), "vencedor");
    placar.textContent = "🏛 " + respostas.length + "/" + ROBOS.length + " robôs responderam em " + ((Date.now() - t0) / 1000).toFixed(1) + "s";
  } else {
    placar.textContent = "🏛 Todas as janelas fecharam — reconecte o Wi-Fi (IP novo = cotas novas) e convoque de novo.";
  }
  btn.disabled = false;
}
</script>
</body>
</html>
